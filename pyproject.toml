[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "almasix-permission"
version = "0.1.0"
description = "Roles and permissions for Almasix (almasix.permission)"
requires-python = ">=3.11"
dependencies = [
    "almasix>=0.9.0",
]
readme = "README.md"
license = "MIT"
authors = [{ name = "Almasix Contributors" }]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0",
    "httpx>=0.27.0",
    "ruff==0.16.6",
]

[project.entry-points."almasix.providers"]
permission = "almasix.permission.provider:PermissionServiceProvider"

[project.urls]
Homepage = "https://github.com/almasix-dev/permission"
Repository = "https://github.com/almasix-dev/permission"
Documentation = "https://almasix-dev.github.io/almasix/"
Issues = "https://github.com/almasix-dev/permission/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/almasix"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/almasix",
    "/tests",
    "/README.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]
python_files = ["test_*.py", "*_test.py"]
markers = [
    "smoke: end-to-end smoke for the permission package",
]

[tool.coverage.run]
branch = true
source = ["almasix.permission"]
omit = [
    "*/almasix/permission/contracts/**",
    "*/almasix/permission/database/migrations/**",
]

[tool.coverage.report]
fail_under = 98
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
    "@overload",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E4", "E7", "E9",
    "F",
    "I",
    "UP",
    "B",
    "RUF100",
]
ignore = ["E731", "UP042", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F811", "B017", "B018"]

[tool.ruff.format]
quote-style = "double"
